<div class="search-bar">
  <div class="search-input">
    <input id="locality" [formControl]="searchControl" placeholder="Cerca località...">
    <ul class="result-list">
      @for (locality of localitiesList(); track locality.name) {
        <li (click)="selectLocality(locality)">
          {{locality.name}}
        </li>
      }
    </ul>
  </div>
</div>
